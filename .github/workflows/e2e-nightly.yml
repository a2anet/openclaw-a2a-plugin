name: E2E (openclaw@latest)

on:
  schedule:
    # 06:00 UTC daily — runs after openclaw's typical publish window.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "openclaw version to test against (npm dist-tag or version)"
        required: false
        default: "latest"

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: E2E against openclaw@${{ github.event.inputs.openclaw_version || 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e tests
        env:
          RUN_E2E: "1"
          OPENCLAW_VERSION: ${{ github.event.inputs.openclaw_version || 'latest' }}
        run: bun test tests/e2e

      - name: Resolve openclaw version
        if: failure()
        id: resolved
        run: |
          version=$(npm view openclaw@${{ github.event.inputs.openclaw_version || 'latest' }} version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.resolved.outputs.version }}' || 'unknown';
            const title = `E2E failure against openclaw@${version}`;
            const body = [
              `Nightly E2E run failed against \`openclaw@${version}\`.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `This usually means an openclaw update broke the plugin's protocol surface.`,
              `Reproduce locally:`,
              ``,
              '```',
              `RUN_E2E=1 OPENCLAW_VERSION=${version} bun test tests/e2e`,
              '```',
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "e2e-failure",
            });
            if (existing.some(issue => issue.title === title)) {
              core.info("Issue already exists, skipping.");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["e2e-failure", "bug"],
            });
